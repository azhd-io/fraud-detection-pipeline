name: CD - Build & Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # allow pushing to GHCR
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/fraud-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (to package model files)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps to train quickly (optional if models already tracked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # If you build models during CI, do it here (optional).
      # - name: Train and export model
      #   run: python src/train_baseline.py

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: docker build -t $IMAGE_NAME:latest .

      - name: Push latest
        run: docker push $IMAGE_NAME:latest

      - name: Tag with commit SHA
        run: |
          SHA=${{ github.sha }}
          docker tag $IMAGE_NAME:latest $IMAGE_NAME:${SHA}
          docker push $IMAGE_NAME:${SHA}

      - name: Verify container runs
        run: |
          docker run --rm -d -p 8000:8000 $IMAGE_NAME:latest
          sleep 5
          curl -f http://localhost:8000/ || (echo "Container failed to start" && exit 1)
